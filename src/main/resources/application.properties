spring.application.name=SOL-DATI

logging.level.root=INFO
logging.level.com.soldati=DEBUG

server.port=9090

logging.file.name=./jpa-test.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%p] [%t] %logger{36} - %msg%n

spring.datasource.url=jdbc:mysql://localhost:3306/kpilocal
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PWD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=drop-and-create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=./define.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.drop-target=./drop.sql

spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false

gitlab.url=${GITLAB_URL}
gitlab.token=${GITLAB_TOKEN}

maven.home=${MAVEN_HOME}
maven.command.parameter=-Dproject.build.sourceEncoding=UTF-8,-Dsonar.sourceEncoding=UTF-8,-Dmaven.compiler.useIncrementalCompilation=false,-Dsonar.host.url=${sonar.host.url},-Dsonar.token=${sonar.token},-DskipTests,-Dexec.skip=true,clean,install,org.sonarsource.scanner.maven:sonar-maven-plugin:sonar,?
maven.command.parameter.non.java=-Dsonar.sources=.|-Dsonar.exclusions=**/target/**,**/node_modules/**,**/.git/**,**/venv/**,**/.venv/**,**/__pycache__/**


sonar.host.url=${SONAR_HOST_URL}
sonar.token=${SONAR_TOKEN}
sonar.scanner.home=${SONAR_SCANNER_HOME}
sonar.scanner.parameter=-Dsonar.sourceEncoding=UTF-8

